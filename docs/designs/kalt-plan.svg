  <rect x="100" y="385" width="214" height="80" fill="#eee" stroke="#c0392b" stroke-width="4"/>
  <line x1="100" y1="410" x2="314" y2="410" stroke="#c0392b" stroke-width="6"/>
  <line x1="100" y1="440" x2="314" y2="440" stroke="#c0392b" stroke-width="6"/>
