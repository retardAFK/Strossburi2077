  <g font-size="18"><text x="180" y="360">🧣</text><text x="480" y="270">🧣</text><text x="620" y="550">🧣</text></g>

  <!-- legende -->
  <rect x="690" y="96" width="190" height="470" fill="#2a2a33" stroke="#555"/>
