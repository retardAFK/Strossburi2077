<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Strasbourg n'est pas à vendre</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<style>
  :root { --bg:#07081a; --fg:#fff8e8; --cyan:#38f2ff; --pink:#ff2e88; --gold:#ffd23f; --blue:#1f5fd0; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg); overflow:hidden;
              font-family:"Press Start 2P", ui-monospace, monospace; }
  #wrap { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
  #stage { position:relative; }
  canvas { display:block; width:100%; height:100%; image-rendering:pixelated; image-rendering:crisp-edges; }
  #hud, #bubbles { position:absolute; inset:0; pointer-events:none; font-size:clamp(8px,1.4vw,14px); }
  #hearts { position:absolute; left:2.5%; top:4%; display:flex; gap:.4em; }
  .heart { width:1.6em; height:1.6em; border-radius:50%; border:.25em solid #5a2a0e; box-sizing:border-box;
           background:radial-gradient(circle, transparent 28%, #d4822e 30%, #b8661f 62%, transparent 64%); }
  .heart.half { clip-path: inset(0 50% 0 0); }
  .heart.empty { opacity:.25; filter:grayscale(1); }
  #room { position:absolute; right:2.5%; top:4%; color:var(--cyan); text-shadow:2px 2px 0 #000; text-align:right; max-width:60%; }
  #boss { position:absolute; left:18%; right:18%; bottom:6%; display:none; text-align:center; color:var(--gold); text-shadow:2px 2px 0 #000; }
  #bossbar { margin-top:.5em; height:.8em; border:.2em solid #000; background:#2a1830; }
  #bossfill { height:100%; width:100%; background:linear-gradient(#ffd23f,#ff2e88); }
  #dialog { position:absolute; left:8%; right:8%; bottom:5%; display:none; padding:1.1em 1.3em; line-height:1.8;
            background:rgba(8,8,36,.93); border:.25em solid var(--cyan); box-shadow:0 0 0 .25em #000, 0 0 1.5em rgba(56,242,255,.35); }
  #dialog .who { color:var(--pink); margin-bottom:.4em; }
  #dialog .next { position:absolute; right:1em; bottom:.6em; color:var(--gold); animation:blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity:0; } }
  .bubble { position:absolute; transform:translate(-50%,-100%); background:#fffbe8; color:#1a1030; padding:.5em .7em;
            border:.18em solid #000; font-size:.75em; line-height:1.5; max-width:40%; white-space:normal; }
  .overlay { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
             gap:1.3em; text-align:center; padding:0 6%; }
  #title { background:radial-gradient(ellipse at center, rgba(31,95,208,.35), rgba(5,5,20,.92)); }
  #title h1, #end h1 { margin:0; font-size:clamp(14px,3.2vw,38px); color:var(--gold); text-shadow:4px 4px 0 var(--blue); line-height:1.4; }
  #title h2 { margin:0; font-size:clamp(9px,1.4vw,15px); color:var(--cyan); }
  #title .controls, #end p { margin:0; font-size:clamp(7px,1vw,11px); color:#b8b0e0; line-height:2.2; }
  #title .go { color:#fff; animation:blink 1s steps(2) infinite; }
  #pause, #end { display:none; background:rgba(5,5,20,.75); }
  #flash { position:absolute; inset:0; background:#fff; opacity:0; pointer-events:none; }
  #banner { position:absolute; left:0; right:0; top:36%; text-align:center; display:none; color:var(--gold);
            font-size:clamp(12px,2.4vw,26px); text-shadow:3px 3px 0 var(--blue); }
  #banner small { display:block; margin-top:.6em; font-size:.5em; color:var(--fg); }
  #prompt { position:absolute; left:0; right:0; bottom:24%; text-align:center; display:none; color:var(--cyan);
            text-shadow:2px 2px 0 #000; animation:pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity:.55; } }
  #pause .hint { margin:0; font-size:clamp(7px,1vw,11px); color:#b8b0e0; }
  .err { color:#f66; position:fixed; top:0; left:0; z-index:9; white-space:pre-wrap; }
</style>
</head>
<body>
<div id="wrap"><div id="stage">
  <canvas id="c"></canvas>
  <div id="bubbles"></div>
  <div id="hud">
    <div id="hearts"></div>
    <div id="room"></div>
    <div id="boss"><span id="bossname"></span><div id="bossbar"><div id="bossfill"></div></div></div>
    <div id="banner"></div>
    <div id="prompt"></div>
    <div id="dialog"><div class="who"></div><div class="txt"></div><div class="next">▼</div></div>
    <div id="flash"></div>
    <div id="pause" class="overlay"><h2 style="color:#fff">PAUSE</h2><p class="hint"></p></div>
    <div id="end" class="overlay"><h1></h1><p></p></div>
    <div id="title" class="overlay"><h1></h1><h2></h2><p class="controls"></p><p class="go"></p></div>
  </div>
</div></div>
<script src="game.js"></script>
</body>
</html>
