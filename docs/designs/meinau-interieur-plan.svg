<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" font-family="Helvetica, Arial, sans-serif" font-size="13" xmlns:c2pa="http://c2pa.org/manifest">
  <rect width="900" height="640" fill="#f4f2ee"/>
  <text x="24" y="34" font-size="20" font-weight="bold" fill="#222">Meinau — intérieur du stade (niveau 3) · plan de jeu v1</text>
  <text x="24" y="54" fill="#666">Coursive d'après photos web ; vestiaires, loges et sous-sols en design standard (validé 23/11).</text>

  <!-- coursive anneau -->
  <rect x="40" y="80" width="600" height="520" rx="60" fill="#c9cdd2" stroke="#444" stroke-width="3"/>
  <!-- tribunes -->
  <rect x="100" y="140" width="480" height="400" rx="30" fill="#9fb3cc" stroke="#2c4f7a" stroke-width="2"/>
  <!-- pelouse -->
  <rect x="170" y="200" width="340" height="280" fill="#6aa864" stroke="#fff" stroke-width="2"/>
  <line x1="340" y1="200" x2="340" y2="480" stroke="#fff" stroke-width="2"/>
  <circle cx="340" cy="340" r="34" fill="none" stroke="#fff" stroke-width="2"/>
  <text x="285" y="335" fill="#fff" font-weight="bold">PELOUSE</text>
  <text x="290" y="353" fill="#fff">boss Egboehly</text>

  <text x="62" y="102" font-weight="bold">COURSIVE EN ANNEAU (béton gris, métal blanc, lumière violette)</text>

  <!-- tribunes labels -->
  <text x="290" y="170" fill="#1d3557" font-weight="bold">Tribune nord</text>
  <text x="270" y="530" fill="#1d3557" font-weight="bold">Tribune sud (fuselages dehors)</text>
  <text x="118" y="350" fill="#1d3557" font-weight="bold" transform="rotate(-90 118 350)">Tribune ouest · KOP</text>
  <text x="565" y="320" fill="#1d3557" font-weight="bold" transform="rotate(90 565 320)">Tribune est</text>

  <!-- entrees depuis niveau 2 -->
  <circle cx="340" cy="600" r="11" fill="#2e9e5b"/><text x="356" y="620" font-size="12">A · portique</text>
  <circle cx="640" cy="200" r="11" fill="#e0a21a"/><text x="650" y="196" font-size="12">B · grille</text>
  <circle cx="40" cy="300" r="11" fill="#c0392b"/>

  <!-- salles -->
  <rect x="90" y="150" width="120" height="44" rx="4" fill="#3d3d8f" stroke="#222"/>
  <text x="98" y="170" fill="#fff" font-weight="bold" font-size="12">Local du kop</text>
  <text x="98" y="186" fill="#fff" font-size="11">tifo (énigme existante)</text>

  <rect x="595" y="130" width="34" height="180" fill="#e8e8e8" stroke="#555"/>
  <text x="617" y="250" font-size="12" font-weight="bold" transform="rotate(-90 617 250)">Vestiaires</text>

  <rect x="60" y="360" width="34" height="180" fill="#d9b44a" stroke="#7a5a00"/>
  <text x="82" y="490" font-size="12" font-weight="bold" transform="rotate(-90 82 490)">Loges VIP BlingCo</text>

  <rect x="595" y="420" width="34" height="140" fill="#777" stroke="#333"/>
  <text x="617" y="540" font-size="12" font-weight="bold" fill="#fff" transform="rotate(-90 617 540)">Sous-sols tech.</text>

  <!-- buvettes -->
  <g fill="#f2a541" stroke="#8a5a00">
    <rect x="160" y="566" width="40" height="18"/><rect x="480" y="566" width="40" height="18"/>
    <rect x="200" y="100" width="40" height="18"/><rect x="400" y="100" width="40" height="18"/>
  </g>
  <!-- escaliers bleus -->
  <g fill="#1f6fd1">
    <rect x="120" y="125" width="14" height="14"/><rect x="546" y="125" width="14" height="14"/>
    <rect x="120" y="540" width="14" height="14"/><rect x="546" y="540" width="14" height="14"/>
  </g>
  <!-- terminal -->
  <rect x="595" y="330" width="34" height="40" fill="#222"/><text x="600" y="355" fill="#0f0" font-size="10">TERM</text>

  <g font-size="18"><text x="600" y="330">🧣</text><text x="600" y="412">🧣</text><text x="440" y="200">🧣</text></g>

  <!-- legende -->
  <rect x="680" y="72" width="196" height="544" fill="#fff" stroke="#ccc"/>
  <text x="692" y="96" font-weight="bold">Légende</text>
  <rect x="692" y="108" width="14" height="10" fill="#f2a541"/><text x="714" y="118">buvette (PNJ, indices)</text>
  <rect x="692" y="128" width="12" height="12" fill="#1f6fd1"/><text x="714" y="140">escalier bleu → tribune</text>
  <rect x="692" y="150" width="14" height="10" fill="#222"/><text x="714" y="160">terminal (énigme)</text>
  <text x="692" y="192" font-weight="bold">Accès</text>
  <text x="692" y="212">· A portique → sud</text>
  <text x="692" y="230">· B grille → coursive est</text>
  <text x="692" y="248">· C secours → coursive ouest</text>
  <text x="692" y="280" font-weight="bold">Verrous Arc-Drapeau</text>
  <text x="692" y="300">· loges VIP</text>
  <text x="692" y="318">· sous-sols techniques</text>
  <text x="692" y="350" font-weight="bold">Écharpes 🧣</text>
  <text x="692" y="370">· pelouse (bord) : principal</text>
  <text x="692" y="388">· vestiaires : secret</text>
  <text x="692" y="406">· sous-sols : objet</text>
  <text x="692" y="440" font-weight="bold">Boucle</text>
  <text x="692" y="460">tour de coursive →</text>
  <text x="692" y="476">local du kop (tifo) →</text>
  <text x="692" y="492">terminal sous-sols →</text>
  <text x="692" y="508">accès pelouse → boss</text>
  <text x="692" y="540" font-weight="bold">À valider</text>
  <text x="692" y="560">· kop tribune ouest ✔</text>
  <text x="692" y="578">· emplacement terminal</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
