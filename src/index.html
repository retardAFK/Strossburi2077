<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Strasbourg">
<meta name="theme-color" content="#07081a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>Strasbourg n'est pas à vendre</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<style>
  :root { --bg:#07081a; --fg:#fff8e8; --cyan:#38f2ff; --pink:#ff2e88; --gold:#ffd23f; --blue:#1f5fd0; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg); overflow:hidden;
              font-family:"Press Start 2P", ui-monospace, monospace; }
  /* pas d'agrandissement automatique du texte (iPhone en paysage) ni de page qui « flotte » / zoome */
  html { -webkit-text-size-adjust:100%; text-size-adjust:100%; }
  html, body { position:fixed; inset:0; width:100%; overscroll-behavior:none; }
  #wrap { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
  #stage { position:relative; }
  canvas { display:block; width:100%; height:100%; image-rendering:pixelated; image-rendering:crisp-edges; }
  #hud, #bubbles { position:absolute; inset:0; pointer-events:none; font-size:clamp(8px,1.4vw,14px); }
  #hearts { position:absolute; left:2.5%; top:4%; display:flex; gap:.4em; }
  .heart { width:1.6em; height:1.6em; border-radius:50%; border:.25em solid #5a2a0e; box-sizing:border-box;
           background:radial-gradient(circle, transparent 28%, #d4822e 30%, #b8661f 62%, transparent 64%); }
  .heart.half { clip-path: inset(0 50% 0 0); }
  .heart.empty { opacity:.25; filter:grayscale(1); }
  #room { position:absolute; right:2.5%; top:4%; color:var(--cyan); text-shadow:2px 2px 0 #000; text-align:right; max-width:60%; }
  #boss { position:absolute; left:18%; right:18%; bottom:6%; display:none; text-align:center; color:var(--gold); text-shadow:2px 2px 0 #000; }
  #bossbar { margin-top:.5em; height:.8em; border:.2em solid #000; background:#2a1830; }
  #bossfill { height:100%; width:100%; background:linear-gradient(#ffd23f,#ff2e88); }
  #dialog { position:absolute; left:8%; right:8%; bottom:5%; display:none; padding:1.1em 1.3em; line-height:1.8;
            background:rgba(8,8,36,.93); border:.25em solid var(--cyan); box-shadow:0 0 0 .25em #000, 0 0 1.5em rgba(56,242,255,.35); }
  #dialog .who { color:var(--pink); margin-bottom:.4em; }
  #dialog .next { position:absolute; right:1em; bottom:.6em; color:var(--gold); animation:blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity:0; } }
  .bubble { position:absolute; transform:translate(-50%,-100%); background:#fffbe8; color:#1a1030; padding:.5em .7em;
            border:.18em solid #000; font-size:.75em; line-height:1.5; max-width:40%; white-space:normal; }
  .overlay { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
             gap:1.3em; text-align:center; padding:0 6%; }
  #title { background:radial-gradient(ellipse at center, rgba(31,95,208,.35), rgba(5,5,20,.92)); }
  #title h1, #end h1 { margin:0; font-size:clamp(14px,3.2vw,38px); color:var(--gold); text-shadow:4px 4px 0 var(--blue); line-height:1.4; }
  #title h2 { margin:0; font-size:clamp(9px,1.4vw,15px); color:var(--cyan); }
  #title .controls, #end p { margin:0; font-size:clamp(7px,1vw,11px); color:#b8b0e0; line-height:2.2; }
  #title .go { color:#fff; animation:blink 1s steps(2) infinite; }
  #pause, #end { display:none; background:rgba(5,5,20,.75); }
  #flash { position:absolute; inset:0; background:#fff; opacity:0; pointer-events:none; }
  #banner { position:absolute; left:0; right:0; top:36%; text-align:center; display:none; color:var(--gold);
            font-size:clamp(12px,2.4vw,26px); text-shadow:3px 3px 0 var(--blue); }
  #banner small { display:block; margin-top:.6em; font-size:.5em; color:var(--fg); }
  #prompt { position:absolute; left:0; right:0; bottom:24%; text-align:center; display:none; color:var(--cyan);
            text-shadow:2px 2px 0 #000; animation:pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity:.55; } }
  #item { position:absolute; left:2.5%; top:12%; display:none; color:var(--gold); text-shadow:2px 2px 0 #000; font-size:.8em; }
  #item b { display:block; margin-top:.3em; font-weight:normal; color:#f4f6ff; font-size:.85em; }
  #aimdot { position:absolute; left:50%; top:50%; width:10px; height:10px; margin:-5px 0 0 -5px; display:none; pointer-events:none;
    border:2px solid #f4f6ff; border-radius:50%; box-shadow:0 0 0 1px #000; }
  #hud.aim #aimdot { display:block; }
  #item small { display:block; margin-top:.4em; font-size:.75em; color:#b8b0e0; }
  #fade { position:absolute; inset:0; background:#000; opacity:0; pointer-events:none; transition:opacity .8s; }
  #glitch { position:absolute; inset:0; width:100%; height:100%; display:none; image-rendering:pixelated; pointer-events:none; mix-blend-mode:screen; }
  #hud.cinema #hearts, #hud.cinema #room, #hud.cinema #item, #hud.cinema #boss, #hud.cinema #prompt { visibility:hidden; }
  #caption { position:absolute; left:10%; right:10%; bottom:9%; display:none; text-align:center; line-height:1.9;
             color:var(--fg); text-shadow:2px 2px 0 #000, 0 0 8px #000; }
  #skip { position:absolute; right:2.5%; bottom:3%; display:none; font-size:.6em; color:#b8b0e0; }
  #pause .hint { margin:0; font-size:clamp(7px,1vw,11px); color:#b8b0e0; }
  /* icônes de commandes (systems/Prompts.js) : touche / bouton dessiné en canvas, à la hauteur du texte */
  img.glyph { height:1.35em; vertical-align:-0.3em; image-rendering:pixelated; margin:0 .1em; }
  #notice { position:absolute; left:10%; right:10%; top:14%; display:none; text-align:center; font-size:.7em; line-height:1.8;
            color:var(--gold); background:rgba(8,8,36,.85); border:.18em solid var(--gold); padding:.6em; }
  #commands { display:none; background:rgba(5,5,20,.92); z-index:2; }
  #commands h2 { margin:0; color:var(--gold); font-size:1.1em; }
  #commands table { border-collapse:collapse; font-size:.7em; line-height:2.1; }
  #commands th { color:var(--cyan); padding:0 1em; font-weight:normal; }
  #commands td { padding:0 1em; text-align:center; } #commands td.what { text-align:right; color:#d8d0f0; }
  #commands .close { margin:0; font-size:.7em; color:#b8b0e0; }
  .err { color:#f66; position:fixed; top:0; left:0; z-index:9; white-space:pre-wrap; }

  /* ---------- tactile (core/Touch.js) ---------- */
  html:has(body.touch) { touch-action:none; }
  body.touch { touch-action:none; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; overscroll-behavior:none; }
  body.touch #prompt { display:none !important; } /* l'indication devient le bouton AGIR */
  body.touch #hud { font-size:clamp(8px,2vw,14px); }
  #touch { position:fixed; inset:0; z-index:5; pointer-events:none; font-family:"Press Start 2P", ui-monospace, monospace; }
  #touch .t-zone { position:absolute; top:0; bottom:0; pointer-events:auto; touch-action:none; }
  #touch .t-left { left:0; width:45%; }
  #touch .t-right { left:45%; right:0; }
  #touch .t-stick { position:absolute; display:none; width:112px; height:112px; transform:translate(-50%,-50%);
                    border-radius:50%; border:3px solid rgba(56,242,255,.55); background:rgba(10,12,36,.35); pointer-events:none; }
  #touch .t-knob { position:absolute; left:50%; top:50%; width:50px; height:50px; border-radius:50%;
                   background:rgba(56,242,255,.6); box-shadow:0 0 12px rgba(56,242,255,.6); transform:translate(-50%,-50%); }
  #touch .t-btn { position:absolute; pointer-events:auto; touch-action:none; border-radius:50%; border:3px solid #000;
                  color:#fff; font:inherit; font-size:9px; display:flex; align-items:center; justify-content:center; padding:0;
                  box-shadow:0 0 0 3px rgba(255,255,255,.25), 0 4px 0 rgba(0,0,0,.5); opacity:.8; -webkit-tap-highlight-color:transparent; }
  #touch .t-btn span { pointer-events:none; text-shadow:1px 1px 0 #000; }
  #touch .t-btn.on { opacity:1; transform:scale(.92); }
  /* grappe en bas à droite (marge des encoches d'écran comprise) */
  #touch .t-attack { width:84px; height:84px; right:calc(24px + env(safe-area-inset-right)); bottom:calc(30px + env(safe-area-inset-bottom)); background:#1f5fd0; font-size:10px; }
  #touch .t-roll { width:62px; height:62px; right:calc(120px + env(safe-area-inset-right)); bottom:calc(18px + env(safe-area-inset-bottom)); background:#2a2d40; }
  #touch .t-lock { width:62px; height:62px; right:calc(40px + env(safe-area-inset-right)); bottom:calc(126px + env(safe-area-inset-bottom)); background:#7a35e0; }
  #touch .t-throw { width:62px; height:62px; right:calc(124px + env(safe-area-inset-right)); bottom:calc(96px + env(safe-area-inset-bottom)); background:#b8661f; }
  #touch .t-use { width:auto; min-width:62px; height:44px; border-radius:22px; padding:0 14px; right:calc(150px + env(safe-area-inset-right));
                  bottom:calc(160px + env(safe-area-inset-bottom)); background:#ff2e88; font-size:8px; animation:pulse 1.2s ease-in-out infinite; }
  #touch .t-switch { width:44px; height:44px; right:calc(196px + env(safe-area-inset-right)); bottom:calc(112px + env(safe-area-inset-bottom)); background:#2a2d40; font-size:16px; }
  #touch .t-aim { width:56px; height:56px; right:calc(200px + env(safe-area-inset-right)); bottom:calc(30px + env(safe-area-inset-bottom)); background:#1f8f5f; font-size:9px; }
  #touch .t-aim.lit { box-shadow:0 0 0 3px #f4f6ff; opacity:1; }
  #touch .t-pause { width:40px; height:40px; left:calc(12px + env(safe-area-inset-left)); top:calc(30% + env(safe-area-inset-top)); background:rgba(10,12,36,.7); font-size:10px; }
  #touch .t-rotate { display:none; position:fixed; inset:0; pointer-events:auto; background:#07081a; color:#ffd23f;
                     align-items:center; justify-content:center; text-align:center; padding:0 10%; line-height:2; font-size:12px; }
  #touch.idle .t-btn:not(.t-pause) { visibility:hidden; }
  /* AGIR : libellé court sur 2 lignes max, posé au-dessus de la grappe, jamais plus large qu'un tiers d'écran */
  #touch .t-use { max-width:min(34vw, 190px); height:auto; min-height:40px; padding:6px 12px; border-radius:16px;
                  white-space:normal; line-height:1.4; text-align:center; font-size:7px; right:calc(18px + env(safe-area-inset-right));
                  bottom:calc(200px + env(safe-area-inset-bottom)); }
  /* petits écrans en paysage (hauteur < 420 px) : grappe réduite pour rester dans l'écran */
  @media (max-height: 420px) {
    #touch .t-attack { width:68px; height:68px; right:calc(16px + env(safe-area-inset-right)); bottom:calc(16px + env(safe-area-inset-bottom)); font-size:8px; }
    #touch .t-roll { width:50px; height:50px; right:calc(94px + env(safe-area-inset-right)); bottom:calc(10px + env(safe-area-inset-bottom)); font-size:7px; }
    #touch .t-lock { width:50px; height:50px; right:calc(26px + env(safe-area-inset-right)); bottom:calc(96px + env(safe-area-inset-bottom)); font-size:7px; }
    #touch .t-throw { width:50px; height:50px; right:calc(96px + env(safe-area-inset-right)); bottom:calc(72px + env(safe-area-inset-bottom)); font-size:7px; }
    #touch .t-switch { width:38px; height:38px; right:calc(156px + env(safe-area-inset-right)); bottom:calc(90px + env(safe-area-inset-bottom)); font-size:13px; }
    #touch .t-aim { width:46px; height:46px; right:calc(156px + env(safe-area-inset-right)); bottom:calc(14px + env(safe-area-inset-bottom)); font-size:7px; }
    #touch .t-use { bottom:calc(156px + env(safe-area-inset-bottom)); max-width:min(30vw, 160px); }
  }
  @media (orientation: portrait) { #touch .t-rotate { display:flex; } }
  /* écran « installe le jeu » (src/install.js), au-dessus de tout, lisible en portrait comme en paysage */
  #install { position:fixed; inset:0; z-index:20; display:flex; align-items:center; justify-content:center; overflow:auto;
             background:radial-gradient(ellipse at center, #14204a, #07081a 70%); touch-action:auto;
             padding:max(12px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
  #install .i-box { max-width:560px; width:100%; text-align:center; line-height:1.8; font-size:10px; }
  #install .i-icon { width:56px; height:56px; image-rendering:pixelated; border-radius:12px; }
  #install h2 { margin:.4em 0; color:var(--gold); font-size:15px; text-shadow:3px 3px 0 var(--blue); }
  #install p { margin:.3em 0 .8em; color:#d8d0f0; }
  #install .i-steps { text-align:left; margin:.6em auto 1em; padding-left:2em; color:#fff; max-width:440px; }
  #install .i-steps li { margin:.4em 0; }
  #install .i-share { width:1.6em; height:1.6em; vertical-align:-.45em; color:var(--cyan); }
  #install button { font:inherit; display:block; margin:.5em auto; padding:.9em 1.4em; border:3px solid #000; color:#fff;
                    box-shadow:0 4px 0 rgba(0,0,0,.5); cursor:pointer; }
  #install .i-go { background:var(--pink); font-size:12px; }
  #install .i-go[hidden] { display:none; }
  #install .i-go:not([hidden]) ~ .i-steps { display:none; } /* vrai bouton dispo : pas besoin du tuto */
  #install .i-browser { background:transparent; border-color:#5a5f80; color:#b8b0e0; box-shadow:none; font-size:9px; }
</style>
</head>
<body>
<div id="wrap"><div id="stage">
  <canvas id="c"></canvas>
  <div id="bubbles"></div>
  <div id="hud">
    <div id="hearts"></div>
    <div id="room"></div>
    <div id="item"></div>
    <div id="aimdot"></div>
    <div id="boss"><span id="bossname"></span><div id="bossbar"><div id="bossfill"></div></div></div>
    <div id="banner"></div>
    <div id="prompt"></div>
    <div id="fade"></div>
    <canvas id="glitch"></canvas>
    <div id="caption"></div>
    <div id="skip"></div>
    <div id="dialog"><div class="who"></div><div class="txt"></div><div class="next">▼</div></div>
    <div id="flash"></div>
    <div id="notice"></div>
    <div id="commands" class="overlay"><h2></h2><table></table><p class="close"></p></div>
    <div id="pause" class="overlay"><h2 style="color:#fff">PAUSE</h2><p class="hint"></p></div>
    <div id="end" class="overlay"><h1></h1><p></p></div>
    <div id="title" class="overlay"><h1></h1><h2></h2><p class="controls"></p><p class="go"></p></div>
  </div>
</div></div>
<script src="game.js"></script>
</body>
</html>
