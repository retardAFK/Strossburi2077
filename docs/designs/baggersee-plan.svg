<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" font-family="Helvetica, Arial, sans-serif" font-size="13" xmlns:c2pa="http://c2pa.org/manifest">
  <defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffb36b"/><stop offset="1" stop-color="#f4f2ee"/></linearGradient></defs>
  <rect width="900" height="640" fill="url(#sky)"/>
  <text x="24" y="34" font-size="20" font-weight="bold" fill="#222">Baggersee — plan d'eau (coucher de soleil) + centre commercial (nuit) · v0</text>
  <text x="24" y="54" fill="#555">Calé sur la vue satellite Google Maps (23/11). Nord en haut. Schéma de jeu, échelle libre.</text>

  <rect x="24" y="72" width="640" height="544" fill="#e9e4d8" stroke="#8a7f74" stroke-width="8"/>

  <!-- nord : quartier -->
  <rect x="300" y="80" width="356" height="60" fill="#cfc6b8"/>
  <text x="310" y="114" fill="#555">Canardière Est · immeubles, terrains de sport (BORD nord)</text>

  <!-- ouest : av de Colmar + tram -->
  <rect x="34" y="80" width="56" height="528" fill="#bdbdbd"/>
  <text x="68" y="470" fill="#333" transform="rotate(-90 68 470)">av. de Colmar · tram A/E Baggersee</text>
  <rect x="96" y="90" width="120" height="56" rx="6" fill="#cfe3f5" stroke="#2c6fb3" stroke-width="2"/>
  <text x="104" y="112" font-weight="bold">1 · Arrêt tram</text>
  <text x="104" y="130">spawn</text>

  <!-- centre commercial -->
  <rect x="96" y="160" width="110" height="200" fill="#b9b9b9" stroke="#555" stroke-width="2"/>
  <text x="104" y="182" font-weight="bold" font-size="12">2 · Parking</text>
  <text x="104" y="198" font-size="12">immense, vide</text>
  <rect x="212" y="170" width="110" height="200" rx="4" fill="#8f8f9e" stroke="#333" stroke-width="3"/>
  <text x="220" y="192" fill="#fff" font-weight="bold">3 · CENTRE</text>
  <text x="220" y="208" fill="#fff" font-weight="bold">COMMERCIAL</text>
  <text x="220" y="226" fill="#eee" font-size="12">niveau intérieur</text>
  <text x="220" y="242" fill="#eee" font-size="12">(nuit, infiltration)</text>
  <rect x="212" y="330" width="110" height="40" fill="#d9b44a"/>
  <text x="218" y="355" font-size="11" font-weight="bold">« BlingCo Lake Mall »</text>

  <!-- lac -->
  <path d="M330 180 C 420 150, 520 170, 540 230 C 560 290, 500 360, 420 370 C 360 375, 330 330, 330 280 Z" fill="#3e8fc4" stroke="#1d5f8a" stroke-width="3"/>
  <text x="380" y="270" fill="#fff" font-weight="bold" font-size="15">4 · LAC</text>
  <text x="372" y="288" fill="#e8f4ff" font-size="12">nage, plongée, bouées</text>
  <!-- plage -->
  <path d="M500 180 C 545 195, 565 250, 548 300 L 572 305 C 590 250, 565 180, 510 165 Z" fill="#f1dc9a" stroke="#b8a060"/>
  <text x="575" y="230" font-weight="bold">5 · Plage</text>
  <text x="575" y="246" font-size="12">volley, pelouses,</text>
  <text x="575" y="262" font-size="12">barbecue, PNJ</text>
  <!-- pompes -->
  <rect x="335" y="300" width="40" height="30" fill="#c0392b"/>
  <text x="300" y="350" font-size="11" fill="#c0392b" font-weight="bold">6 · Pompes BlingCo</text>
  <!-- pontons -->
  <g fill="#8a5a2b"><rect x="430" y="210" width="40" height="6"/><rect x="470" y="300" width="36" height="6"/></g>
  <g fill="#ff7f50"><circle cx="410" cy="320" r="5"/><circle cx="450" cy="330" r="5"/><circle cx="490" cy="250" r="5"/></g>

  <!-- foret sud -->
  <rect x="300" y="390" width="356" height="218" fill="#3f7a4a"/>
  <text x="312" y="414" fill="#fff" font-weight="bold">7 · Forêt (parcours de santé) — BORD sud</text>
  <g fill="#ff4fd8" stroke="#a0008a"><polygon points="360,470 372,440 384,470"/><polygon points="420,500 432,470 444,500"/><polygon points="500,460 512,430 524,460"/></g>
  <text x="312" y="530" fill="#ffd6f5" font-weight="bold">8 · Forêt en plastique BlingCo</text>
  <text x="312" y="548" fill="#eee" font-size="12">arbres creux, étiquettes prix</text>

  <!-- sud-ouest : route -->
  <path d="M96 600 C 160 520, 230 420, 300 400" fill="none" stroke="#999" stroke-width="14"/>
  <text x="110" y="500" fill="#555" font-size="11" transform="rotate(-45 110 500)">rte Alfred Kastler (BORD)</text>

  <!-- entrées mall -->
  <circle cx="212" cy="240" r="10" fill="#2e9e5b"/>
  <circle cx="322" cy="300" r="10" fill="#e0a21a"/>
  <circle cx="267" cy="170" r="10" fill="#c0392b"/>

  <g font-size="18"><text x="520" y="290">🧣</text><text x="445" y="355">🧣</text><text x="470" y="500">🧣</text></g>

  <!-- légende -->
  <rect x="680" y="72" width="196" height="544" fill="#fff" stroke="#ccc"/>
  <text x="692" y="96" font-weight="bold">Parcours</text>
  <text x="692" y="116">tram → plage (soleil</text>
  <text x="692" y="132">couchant) → lac →</text>
  <text x="692" y="148">pompes → centre (nuit)</text>
  <text x="692" y="182" font-weight="bold">Entrées du centre</text>
  <circle cx="700" cy="200" r="7" fill="#2e9e5b"/><text x="714" y="204">parking (normale)</text>
  <circle cx="700" cy="222" r="7" fill="#e0a21a"/><text x="714" y="226">quai livraison côté</text>
  <text x="714" y="242" font-size="11">lac (plongée sous les pompes)</text>
  <circle cx="700" cy="262" r="7" fill="#c0392b"/><text x="714" y="266">toit / enseigne</text>
  <text x="714" y="282" font-size="11">(secret)</text>
  <text x="692" y="316" font-weight="bold">Écharpes 🧣</text>
  <text x="692" y="336">· plage : principal</text>
  <text x="692" y="352">· sous l'eau : secret</text>
  <text x="692" y="368">· forêt plastique : objet</text>
  <text x="692" y="402" font-weight="bold">Absurde BlingCo</text>
  <text x="692" y="422">lac pompé, forêt en</text>
  <text x="692" y="438">plastique, méga mall</text>
  <text x="692" y="472" font-weight="bold">Intérieur (repris du</text>
  <text x="692" y="488" font-weight="bold">Marché 2000)</text>
  <text x="692" y="508">rayons, réserve, toit,</text>
  <text x="692" y="524">marché noir, Stork,</text>
  <text x="692" y="540">boss Gérant de nuit</text>
  <text x="692" y="572" font-weight="bold">À valider</text>
  <text x="692" y="592">entrée par la plongée ?</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
