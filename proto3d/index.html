<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Strasbourg 3000 — Cathédrale</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<style>
  :root { --bg:#07081a; --fg:#fff8e8; --accent:#38f2ff; --pink:#ff2e88; --gold:#ffd23f; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg); overflow:hidden;
              font-family:"Press Start 2P", ui-monospace, monospace; }
  #wrap { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
  #stage { position:relative; }
  canvas { display:block; width:100%; height:100%; image-rendering:pixelated; image-rendering:crisp-edges; }
  #hud { position:absolute; inset:0; pointer-events:none; font-size:clamp(8px,1.4vw,14px); }
  #hearts { position:absolute; left:2.5%; top:4%; display:flex; gap:.4em; }
  .heart { width:1.6em; height:1.6em; border-radius:50%; border:.25em solid #5a2a0e; box-sizing:border-box;
           background:radial-gradient(circle at 50% 50%, transparent 28%, #d4822e 30%, #b8661f 62%, transparent 64%); }
  .heart.half { clip-path: inset(0 50% 0 0); }
  .heart.empty { opacity:.25; filter:grayscale(1); }
  #keys { position:absolute; left:2.5%; top:12%; color:var(--gold); text-shadow:2px 2px 0 #000; }
  #room { position:absolute; right:2.5%; top:4%; color:var(--accent); text-shadow:2px 2px 0 #000; text-align:right; }
  #boss { position:absolute; left:20%; right:20%; bottom:6%; display:none; text-align:center; color:var(--gold); text-shadow:2px 2px 0 #000; }
  #bossbar { margin-top:.5em; height:.8em; border:.2em solid #000; background:#2a1830; }
  #bossfill { height:100%; width:100%; background:linear-gradient(#ff8c1a,#e0303a); }
  #dialog { position:absolute; left:8%; right:8%; bottom:5%; display:none; padding:1.1em 1.3em; line-height:1.8;
            background:rgba(10,8,40,.92); border:.25em solid var(--fg); box-shadow:0 0 0 .25em #000; }
  #dialog .who { color:var(--pink); margin-bottom:.4em; }
  #dialog .next { position:absolute; right:1em; bottom:.6em; color:var(--gold); animation:blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity:0; } }
  #title { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
           gap:1.4em; background:radial-gradient(ellipse at center, rgba(40,20,80,.6), rgba(5,5,20,.92)); text-align:center; }
  #title h1 { margin:0; font-size:clamp(18px,4vw,44px); color:var(--gold); text-shadow:4px 4px 0 #8a1030; line-height:1.3; }
  #title h2 { margin:0; font-size:clamp(9px,1.4vw,15px); color:var(--accent); }
  #title p { margin:0; font-size:clamp(7px,1vw,11px); color:#b8b0e0; line-height:2.2; }
  #title .go { color:#fff; animation:blink 1s steps(2) infinite; }
  #flash { position:absolute; inset:0; background:#fff; opacity:0; pointer-events:none; }
  #banner { position:absolute; left:0; right:0; top:38%; text-align:center; display:none; color:var(--gold);
            font-size:clamp(12px,2.4vw,26px); text-shadow:3px 3px 0 #8a1030; }
  #banner small { display:block; margin-top:.6em; font-size:.5em; color:var(--fg); }
</style>
</head>
<body>
<div id="wrap"><div id="stage">
  <canvas id="c"></canvas>
  <div id="hud">
    <div id="hearts"></div>
    <div id="keys"></div>
    <div id="room"></div>
    <div id="boss">LE COQ DE L'HORLOGE<div id="bossbar"><div id="bossfill"></div></div></div>
    <div id="banner"></div>
    <div id="dialog"><div class="who"></div><div class="txt"></div><div class="next">▼</div></div>
    <div id="flash"></div>
    <div id="title">
      <h1>STRASBOURG 3000</h1>
      <h2>DONJON I : LA CATHÉDRALE</h2>
      <p>ZQSD / flèches : bouger · J / clic : bretzel-bâton · Espace : roulade<br>
         Maj / L / clic droit : verrouiller une cible · E : ouvrir · Entrée : dialogues · M : son</p>
      <p class="go">APPUIE SUR ENTRÉE</p>
    </div>
  </div>
</div></div>
<script src="models.js"></script>
<script src="game3d.js"></script>
</body>
</html>
