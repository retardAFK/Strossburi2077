  <text x="702" y="260" fill="#ddd">· cour (normale)</text>
  <text x="702" y="276" fill="#ddd">· toit hangar (Stork ?)</text>
  <text x="702" y="292" fill="#ddd">· ruelle → cave (secret)</text>
