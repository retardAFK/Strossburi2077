<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Strasbourg 3000</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<style>
  :root { --bg:#07081a; --fg:#e8e6ff; --muted:#8a8fb8; --accent:#38f2ff; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg); }
  body { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px;
         font-family:"Press Start 2P", ui-monospace, monospace; }
  #game { image-rendering: pixelated; image-rendering: crisp-edges; display:block;
          box-shadow: 0 0 0 2px #1d2147, 0 0 40px rgba(56,242,255,.15); background:#000; }
  #help { font-size:9px; line-height:1.9; color:var(--muted); text-align:center; max-width:960px; padding:0 16px; }
  #help b { color:var(--accent); font-weight:normal; }
</style>
</head>
<body>
<canvas id="game" width="384" height="216"></canvas>
<div id="help">
  <b>Flèches / ZQSD</b> se déplacer &nbsp;·&nbsp; <b>J</b> ou <b>X</b> frapper (enchaîner = combo)
  &nbsp;·&nbsp; <b>K</b>, <b>C</b> ou <b>Espace</b> sauter (+ frapper en l'air = coup de pied sauté)<br>
  <b>L</b> ou <b>V</b> Tornade de Bretzel (coûte un peu de vie) &nbsp;·&nbsp; <b>Entrée</b> valider
  &nbsp;·&nbsp; <b>P</b> pause &nbsp;·&nbsp; <b>M</b> son &nbsp;·&nbsp; manette compatible
</div>
<script src="assets/meta.js"></script>
<script src="game.js"></script>
</body>
</html>
